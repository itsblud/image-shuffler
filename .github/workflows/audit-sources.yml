name: Audit image sources (lightweight)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run lightweight source audit
        run: python audit_sources.py

      - name: Show audit summary
        run: cat audit-output/source-audit.md

      - name: Upload audit output
        uses: actions/upload-artifact@v7
        with:
          name: shuffler-source-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
