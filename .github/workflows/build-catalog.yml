name: Build image catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build catalog
        shell: python
        run: |
          import concurrent.futures
          import json
          import random
          import re
          import time
          import urllib.parse
          import urllib.request

          MIN_WIDTH = 240
          MIN_HEIGHT = 180

          WAYBACK_SOURCES = [
              ("GeoCities", "geocities.com", 1994),
              ("Photo.net", "photo.net", 1994),
              ("Webshots", "webshots.com", 1995),
              ("Tripod", "tripod.com", 1995),
              ("Angelfire", "angelfire.com", 1996),
              ("Fotki", "fotki.com", 1998),
              ("PictureTrail", "picturetrail.com", 1998),
              ("PBase", "pbase.com", 1999),
              ("SmugMug", "smugmug.com", 2002),
              ("Photobucket", "photobucket.com", 2003),
              ("ImageShack", "imageshack.us", 2003),
              ("TinyPic", "tinypic.com", 2004),
              ("Flickr", "static.flickr.com", 2004),
              ("Zooomr", "zooomr.com", 2005),
          ]

          BAD = re.compile(
              r"(avatar|banner|button|icon|logo|pixel|spacer|tracker|counter|"
              r"smiley|emoticon|sprite|thumb|thumbnail|favicon|advert|adserver|"
              r"badge|toolbar|header|footer|nav|menu)",
              re.I,
          )
          JPEG = re.compile(r"\.(?:jpe?g)(?:[?#].*)?$", re.I)
          UA = "OldImageShuffler/1.3 (+GitHub Pages; archival image browser)"

          def fetch_json(url, retries=3):
              delay = 1.5
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": UA,
                              "Accept": "application/json,text/plain,*/*",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=22) as r:
                          return json.loads(r.read().decode("utf-8", "replace"))
                  except Exception:
                      if attempt == retries - 1:
                          raise
                      time.sleep(delay)
                      delay *= 2

          # ---------- WAYBACK ----------
          def query_wayback_block(source, domain, start_year, end_year):
              params = [
                  ("url", domain),
                  ("matchType", "domain"),
                  ("output", "json"),
                  ("fl", "timestamp,original,mimetype,statuscode,digest,length"),
                  ("from", f"{start_year:04d}0101"),
                  ("to", f"{end_year:04d}1231"),
                  ("filter", "statuscode:200"),
                  ("filter", "mimetype:image/jpeg"),
                  ("collapse", "digest"),
                  ("limit", "500"),
              ]
              url = "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode(params)

              try:
                  rows = fetch_json(url)
              except Exception as e:
                  print(f"skip Wayback {source} {start_year}-{end_year}: {e}")
                  return []

              if not rows or len(rows) < 2:
                  return []

              out = []
              for row in rows[1:]:
                  if len(row) < 6:
                      continue

                  ts, original, mime, status, digest, length = row[:6]

                  try:
                      year = int(ts[:4])
                      size = int(length or 0)
                  except Exception:
                      continue

                  if year < 1994 or year > 2008:
                      continue
                  if not JPEG.search(original):
                      continue
                  if BAD.search(original):
                      continue
                  if mime != "image/jpeg":
                      continue
                  if size and size < 18000:
                      continue
                  if not digest:
                      continue

                  out.append({
                      "year": year,
                      "source": source,
                      "digest": "wayback:" + digest,
                      "original": original,
                      "archive": f"https://web.archive.org/web/{ts}id_/{original}",
                  })

              return out

          # ---------- WIKIMEDIA COMMONS ----------
          # Uses the per-year categories "1994 photographs" ... "2008 photographs".
          # This is better than scraping a search-results page because the year is
          # explicit in Commons' own category structure.
          def query_commons_year(year):
              base = "https://commons.wikimedia.org/w/api.php"
              continuation = None
              out = []

              # Cap each year so Commons broadens the mix without overwhelming the
              # old-web-host material.
              per_year_cap = 120

              while len(out) < per_year_cap:
                  params = {
                      "action": "query",
                      "generator": "categorymembers",
                      "gcmtitle": f"Category:{year} photographs",
                      "gcmtype": "file",
                      "gcmlimit": "max",
                      "prop": "imageinfo",
                      "iiprop": "url|size|mime|sha1",
                      "format": "json",
                      "formatversion": "2",
                  }
                  if continuation:
                      params["gcmcontinue"] = continuation

                  url = base + "?" + urllib.parse.urlencode(params)

                  try:
                      data = fetch_json(url)
                  except Exception as e:
                      print(f"skip Commons {year}: {e}")
                      break

                  for page in data.get("query", {}).get("pages", []):
                      info_list = page.get("imageinfo") or []
                      if not info_list:
                          continue

                      info = info_list[0]
                      mime = info.get("mime", "")
                      image_url = info.get("url", "")
                      sha1 = info.get("sha1", "")
                      width = int(info.get("width") or 0)
                      height = int(info.get("height") or 0)
                      size = int(info.get("size") or 0)

                      if mime != "image/jpeg":
                          continue
                      if not image_url.startswith("https://upload.wikimedia.org/"):
                          continue
                      if width < MIN_WIDTH or height < MIN_HEIGHT:
                          continue
                      if size and size < 18000:
                          continue
                      if not sha1:
                          continue

                      out.append({
                          "year": year,
                          "source": "Wikimedia Commons",
                          "digest": "commons:" + sha1,
                          "original": page.get("title", ""),
                          "archive": image_url,
                      })

                      if len(out) >= per_year_cap:
                          break

                  if len(out) >= per_year_cap:
                      break

                  continuation = data.get("continue", {}).get("gcmcontinue")
                  if not continuation:
                      break

              random.shuffle(out)
              return out[:per_year_cap]

          # Run Wayback work in limited parallelism.
          wayback_jobs = []
          for source, domain, born in WAYBACK_SOURCES:
              y = max(1994, born)
              while y <= 2008:
                  wayback_jobs.append((source, domain, y, min(y + 2, 2008)))
                  y += 3

          all_rows = []

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(query_wayback_block, *job) for job in wayback_jobs]
              for future in concurrent.futures.as_completed(futures):
                  try:
                      all_rows.extend(future.result())
                  except Exception as e:
                      print("Wayback worker error:", e)

          # Commons is queried per year using its public MediaWiki API.
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(query_commons_year, year) for year in range(1994, 2009)]
              for future in concurrent.futures.as_completed(futures):
                  try:
                      all_rows.extend(future.result())
                  except Exception as e:
                      print("Commons worker error:", e)

          # Global content-level dedupe.
          random.shuffle(all_rows)
          seen_digests = set()
          buckets = {}

          for item in all_rows:
              digest = item["digest"]
              if digest in seen_digests:
                  continue
              seen_digests.add(digest)

              bucket = (item["source"], item["year"])
              buckets.setdefault(bucket, [])

              # Preserve source/year diversity.
              source_cap = 20 if item["source"] == "Wikimedia Commons" else 15
              if len(buckets[bucket]) < source_cap:
                  buckets[bucket].append(item)

          catalog = []
          for items in buckets.values():
              catalog.extend(items)

          random.shuffle(catalog)
          catalog = catalog[:3500]

          print("catalog size:", len(catalog))
          print("Commons images:", sum(1 for x in catalog if x["source"] == "Wikimedia Commons"))

          if len(catalog) < 25:
              raise RuntimeError(
                  "Sources returned too few usable images; catalog was not replaced."
              )

          with open("catalog.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, separators=(",", ":"))

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh image catalog"
          git push
