name: Build image catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build catalog from Wayback Machine
        shell: python
        run: |
          import concurrent.futures
          import json
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          SOURCES = [
              ("GeoCities", "geocities.com", 1994),
              ("Photo.net", "photo.net", 1994),
              ("Webshots", "webshots.com", 1995),
              ("Tripod", "tripod.com", 1995),
              ("Angelfire", "angelfire.com", 1996),
              ("Fotki", "fotki.com", 1998),
              ("PictureTrail", "picturetrail.com", 1998),
              ("PBase", "pbase.com", 1999),
              ("SmugMug", "smugmug.com", 2002),
              ("Photobucket", "photobucket.com", 2003),
              ("ImageShack", "imageshack.us", 2003),
              ("TinyPic", "tinypic.com", 2004),
              ("Flickr", "static.flickr.com", 2004),
              ("Zooomr", "zooomr.com", 2005),
          ]

          BAD = re.compile(
              r"(avatar|banner|button|icon|logo|pixel|spacer|tracker|counter|"
              r"smiley|emoticon|sprite|thumb|thumbnail|favicon|advert|adserver|"
              r"badge|toolbar|header|footer|nav|menu)",
              re.I,
          )
          JPEG = re.compile(r"\.(?:jpe?g)(?:[?#].*)?$", re.I)
          UA = "Mozilla/5.0 (compatible; OldImageShuffler/1.1)"

          def fetch_json(url, retries=2):
              delay = 1.5
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": UA,
                              "Accept": "application/json,text/plain,*/*",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=18) as r:
                          return json.loads(r.read().decode("utf-8", "replace"))
                  except Exception:
                      if attempt == retries - 1:
                          raise
                      time.sleep(delay)
                      delay *= 2

          def query_block(source, domain, start_year, end_year):
              params = [
                  ("url", domain),
                  ("matchType", "domain"),
                  ("output", "json"),
                  ("fl", "timestamp,original,mimetype,statuscode,digest,length"),
                  ("from", f"{start_year:04d}0101"),
                  ("to", f"{end_year:04d}1231"),
                  ("filter", "statuscode:200"),
                  ("filter", "mimetype:image/jpeg"),
                  ("collapse", "digest"),
                  ("limit", "500"),
              ]
              url = "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode(params)

              try:
                  rows = fetch_json(url)
              except Exception as e:
                  print(f"skip {source} {start_year}-{end_year}: {e}")
                  return []

              if not rows or len(rows) < 2:
                  return []

              out = []
              for row in rows[1:]:
                  if len(row) < 6:
                      continue

                  ts, original, mime, status, digest, length = row[:6]

                  try:
                      year = int(ts[:4])
                      size = int(length or 0)
                  except Exception:
                      continue

                  if year < 1994 or year > 2008:
                      continue
                  if not JPEG.search(original):
                      continue
                  if BAD.search(original):
                      continue
                  if mime != "image/jpeg":
                      continue
                  if size and size < 18000:
                      continue

                  out.append({
                      "year": year,
                      "source": source,
                      "original": original,
                      "archive": f"https://web.archive.org/web/{ts}id_/{original}",
                  })

              return out

          jobs = []
          for source, domain, born in SOURCES:
              first = max(1994, born)
              y = first
              while y <= 2008:
                  jobs.append((source, domain, y, min(y + 2, 2008)))
                  y += 3

          all_rows = []
          # Limited concurrency keeps the run fast without hammering Wayback.
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(query_block, *job) for job in jobs]
              for future in concurrent.futures.as_completed(futures):
                  try:
                      all_rows.extend(future.result())
                  except Exception as e:
                      print("worker error:", e)

          # Deduplicate and balance by source/year so one host cannot dominate.
          buckets = {}
          seen = set()

          random.shuffle(all_rows)

          for item in all_rows:
              key = item["original"].lower()
              if key in seen:
                  continue
              seen.add(key)

              bucket = (item["source"], item["year"])
              buckets.setdefault(bucket, [])
              if len(buckets[bucket]) < 15:
                  buckets[bucket].append(item)

          catalog = []
          for items in buckets.values():
              catalog.extend(items)

          random.shuffle(catalog)
          catalog = catalog[:3000]

          print("catalog size:", len(catalog))

          if len(catalog) < 25:
              raise RuntimeError(
                  "Wayback returned too few usable images; catalog was not replaced."
              )

          with open("catalog.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, separators=(",", ":"))

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh image catalog"
          git push
