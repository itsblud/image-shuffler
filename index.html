<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Image Shuffler</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{height:100dvh;display:grid;grid-template-rows:1fr auto;background:#000}
#stage{min-height:0;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 8px;cursor:pointer}
#image{display:none;max-width:100%;max-height:100%;object-fit:contain}
#message{color:#aaa;font-size:14px;text-align:center;padding:24px;line-height:1.4}
#nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button{appearance:none;border:1px solid #333;background:#111;color:#fff;border-radius:12px;min-height:52px;font-size:18px;font-weight:600}
button:active{background:#222}
button:disabled{opacity:.35}
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.9);z-index:10}
#overlay.open{display:grid}
#panel{width:min(88vw,420px);background:#111;border:1px solid #333;border-radius:16px;padding:20px;color:#fff}
#years{text-align:center;font-size:22px;font-weight:700;margin-bottom:14px}
input[type=range]{width:100%;margin:14px 0}
#done{width:100%;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Tap image area to change year range">
    <img id="image" alt="" referrerpolicy="no-referrer">
    <div id="message">Loading…</div>
  </div>
  <div id="nav">
    <button id="back" disabled>Back</button>
    <button id="next">Next</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <div id="years"></div>
    <input id="from" aria-label="Earliest year" type="range" min="1994" max="2008" value="1994" step="1">
    <input id="to" aria-label="Latest year" type="range" min="1994" max="2008" value="2008" step="1">
    <button id="done">Done</button>
  </div>
</div>

<script>
const img=document.querySelector('#image');
const msg=document.querySelector('#message');
const stage=document.querySelector('#stage');
const back=document.querySelector('#back');
const next=document.querySelector('#next');
const overlay=document.querySelector('#overlay');
const from=document.querySelector('#from');
const to=document.querySelector('#to');
const years=document.querySelector('#years');
const done=document.querySelector('#done');

let catalog=[];
let filtered=[];
let history=[];
let index=-1;
let requestToken=0;

function readSavedRange(){
  try{
    const x=JSON.parse(localStorage.getItem('oldImageRange')||'{}');
    return {
      from:Number.isFinite(+x.from)?+x.from:1994,
      to:Number.isFinite(+x.to)?+x.to:2008
    };
  }catch{
    return {from:1994,to:2008};
  }
}

const saved=readSavedRange();
from.value=Math.max(1994,Math.min(2008,saved.from));
to.value=Math.max(1994,Math.min(2008,saved.to));

function normalizedRange(){
  let a=+from.value,b=+to.value;
  if(a>b)[a,b]=[b,a];
  years.textContent=`${a} – ${b}`;
  return[a,b];
}
from.oninput=normalizedRange;
to.oninput=normalizedRange;
normalizedRange();

function setMessage(text){
  img.style.display='none';
  msg.style.display='block';
  msg.textContent=text;
}

function filterCatalog(){
  const[a,b]=normalizedRange();
  filtered=catalog.filter(x=>{
    const y=Number(x.year);
    return y>=a&&y<=b&&typeof x.archive==='string'&&x.archive.startsWith('https://web.archive.org/');
  });
}

function randomCandidate(){
  if(!filtered.length)return null;
  return filtered[Math.floor(Math.random()*filtered.length)];
}

function preload(url,timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const test=new Image();
    let settled=false;
    const finish=(ok)=>{
      if(settled)return;
      settled=true;
      clearTimeout(timer);
      test.onload=null;
      test.onerror=null;
      ok?resolve(url):reject(new Error('image failed'));
    };
    const timer=setTimeout(()=>finish(false),timeoutMs);
    test.onload=()=>finish(true);
    test.onerror=()=>finish(false);
    test.referrerPolicy='no-referrer';
    test.src=url;
  });
}

async function findWorkingImage(maxAttempts=8){
  const token=++requestToken;
  if(!filtered.length)throw new Error('empty');

  const tried=new Set();
  for(let i=0;i<maxAttempts;i++){
    if(token!==requestToken)throw new Error('cancelled');
    let item=randomCandidate();
    if(!item)break;

    // Avoid immediately retrying the same candidate within this request.
    let guard=0;
    while(tried.has(item.archive)&&guard++<20)item=randomCandidate();
    tried.add(item.archive);

    try{
      await preload(item.archive);
      if(token!==requestToken)throw new Error('cancelled');
      return item;
    }catch(e){
      if(e.message==='cancelled')throw e;
    }
  }
  throw new Error('unavailable');
}

function render(item){
  if(!item)return;
  msg.style.display='none';
  img.style.display='block';
  img.src=item.archive;
  back.disabled=index<=0;
}

async function nextImage(){
  if(index<history.length-1){
    index++;
    render(history[index]);
    return;
  }

  next.disabled=true;
  setMessage('Finding image…');

  try{
    const item=await findWorkingImage();
    history=history.slice(0,index+1);
    history.push(item);
    index=history.length-1;
    render(item);
  }catch(e){
    if(e.message!=='cancelled'){
      setMessage('No working image found. Tap Next to try again.');
    }
  }finally{
    next.disabled=false;
    back.disabled=index<=0;
  }
}

back.onclick=()=>{
  requestToken++;
  if(index>0){
    index--;
    render(history[index]);
  }
};

next.onclick=nextImage;

stage.onclick=()=>overlay.classList.add('open');

done.onclick=()=>{
  const[a,b]=normalizedRange();
  from.value=a;
  to.value=b;
  localStorage.setItem('oldImageRange',JSON.stringify({from:a,to:b}));
  overlay.classList.remove('open');
  requestToken++;
  history=[];
  index=-1;
  filterCatalog();
  back.disabled=true;

  if(!filtered.length){
    setMessage('No images in this date range.');
    return;
  }
  nextImage();
};

overlay.onclick=e=>{
  if(e.target===overlay)overlay.classList.remove('open');
};

async function boot(){
  try{
    const r=await fetch('./catalog.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('catalog http');
    const data=await r.json();
    if(!Array.isArray(data)||!data.length)throw new Error('catalog empty');

    catalog=data;
    filterCatalog();

    if(!filtered.length){
      setMessage('No images in this date range. Tap here to change the range.');
      return;
    }
    nextImage();
  }catch(e){
    setMessage('Image catalog is not ready yet. Tap here to change dates.');
  }
}

boot();
</script>
</body>
</html>
