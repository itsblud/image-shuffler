<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Old Image Shuffler</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  #app {
    height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    background: #000;
  }
  #stage {
    min-height: 0;
    display: grid;
    place-items: center;
    padding: max(10px, env(safe-area-inset-top)) 10px 8px;
  }
  #image {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
    cursor: pointer;
  }
  #nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding:
      10px
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }
  button {
    appearance: none;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    border-radius: 12px;
    min-height: 52px;
    font-size: 18px;
    font-weight: 600;
  }
  button:active { background: #222; }
  button:disabled { opacity: .3; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(0,0,0,.9);
    z-index: 10;
  }
  #overlay.open { display: grid; }
  #panel {
    width: min(88vw, 420px);
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 20px;
    color: #fff;
  }
  #years {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  input[type=range] { width: 100%; margin: 14px 0; }
  #done { width: 100%; margin-top: 10px; }
  #status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    color: rgba(255,255,255,.55);
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><img id="image" alt=""></div>
  <div id="nav">
    <button id="back">Back</button>
    <button id="next">Next</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <div id="years"></div>
    <input id="from" type="range" min="1994" max="2008" value="1994" step="1">
    <input id="to" type="range" min="1994" max="2008" value="2008" step="1">
    <button id="done">Done</button>
  </div>
</div>

<div id="status"></div>

<script>
const SOURCES = [
  {name:"Webshots", domain:"webshots.com", born:1995},
  {name:"Fotki", domain:"fotki.com", born:1998},
  {name:"PictureTrail", domain:"picturetrail.com", born:1998},
  {name:"PBase", domain:"pbase.com", born:1999},
  {name:"Photobucket", domain:"photobucket.com", born:2003},
  {name:"ImageShack", domain:"imageshack.us", born:2003},
  {name:"TinyPic", domain:"tinypic.com", born:2004},
  {name:"ImageVenue", domain:"imagevenue.com", born:2004},
  {name:"Flickr", domain:"static.flickr.com", born:2004},
  {name:"ImageBam", domain:"imagebam.com", born:2006}
];

const BAD = /(avatar|banner|button|icon|logo|pixel|spacer|tracker|counter|smiley|emoticon|sprite|thumb|thumbnail|favicon|advert|adserver|badge|toolbar)/i;

const img = document.querySelector('#image');
const back = document.querySelector('#back');
const next = document.querySelector('#next');
const overlay = document.querySelector('#overlay');
const from = document.querySelector('#from');
const to = document.querySelector('#to');
const years = document.querySelector('#years');
const done = document.querySelector('#done');
const statusEl = document.querySelector('#status');

let history = [];
let index = -1;
let busy = false;

const saved = JSON.parse(localStorage.getItem('oldImageRange') || '{"from":1994,"to":2008}');
from.value = Math.max(1994, Math.min(2008, saved.from || 1994));
to.value = Math.max(1994, Math.min(2008, saved.to || 2008));

function normalizedRange() {
  let a = +from.value, b = +to.value;
  if (a > b) [a,b] = [b,a];
  from.value = a;
  to.value = b;
  years.textContent = `${a} – ${b}`;
  return [a,b];
}
from.oninput = normalizedRange;
to.oninput = normalizedRange;
normalizedRange();

function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function pad2(n) { return String(n).padStart(2,'0'); }
function monthEnd(y,m) { return new Date(y,m,0).getDate(); }

async function cdx(domain, start, end) {
  const params = new URLSearchParams({
    url: domain,
    matchType: 'domain',
    output: 'json',
    fl: 'timestamp,original,mimetype,statuscode,digest,length',
    from: start,
    to: end,
    filter: 'statuscode:200',
    collapse: 'digest',
    limit: '150'
  });

  // Wayback's CDX endpoint is queried directly; image payloads themselves
  // load as normal cross-origin <img> resources.
  const url = 'https://web.archive.org/cdx/search/cdx?' + params.toString();
  const res = await fetch(url, {cache:'no-store'});
  if (!res.ok) throw new Error('CDX request failed');
  const rows = await res.json();
  if (!Array.isArray(rows) || rows.length < 2) return [];

  return rows.slice(1).map(r => ({
    timestamp: r[0],
    original: r[1],
    mimetype: r[2],
    length: Number(r[5] || 0)
  })).filter(x => {
    if (!/\.(jpe?g|png)(?:[?#].*)?$/i.test(x.original)) return false;
    if (BAD.test(x.original)) return false;
    if (!/^image\/(jpeg|jpg|png)$/i.test(x.mimetype || '')) return false;
    if (x.length && x.length < 12000) return false;
    return true;
  });
}

async function findRandomCapture() {
  const [minYear,maxYear] = normalizedRange();
  const eligible = SOURCES.filter(s => s.born <= maxYear);

  for (let tries = 0; tries < 24; tries++) {
    const src = randomItem(eligible);
    const lo = Math.max(minYear, src.born);
    if (lo > maxYear) continue;

    const y = lo + Math.floor(Math.random() * (maxYear - lo + 1));
    const m = 1 + Math.floor(Math.random() * 12);
    const start = `${y}${pad2(m)}01`;
    const end = `${y}${pad2(m)}${pad2(monthEnd(y,m))}`;

    try {
      const rows = await cdx(src.domain, start, end);
      if (!rows.length) continue;
      const pick = randomItem(rows);
      pick.source = src.name;
      return pick;
    } catch (e) {}
  }

  throw new Error('No image found');
}

function archiveImageURL(item) {
  return `https://web.archive.org/web/${item.timestamp}id_/${item.original}`;
}

function show(item) {
  back.disabled = index <= 0;
  statusEl.textContent = '';
  img.src = archiveImageURL(item);
}

async function getNext() {
  if (busy) return;

  if (index < history.length - 1) {
    index++;
    show(history[index]);
    return;
  }

  busy = true;
  next.disabled = true;
  statusEl.textContent = 'finding image…';

  try {
    const item = await findRandomCapture();

    const tester = new Image();
    tester.onload = () => {
      history = history.slice(0,index+1);
      history.push(item);
      index = history.length - 1;
      img.src = tester.src;
      statusEl.textContent = '';
      back.disabled = index <= 0;
      next.disabled = false;
      busy = false;
    };
    tester.onerror = () => {
      next.disabled = false;
      busy = false;
      getNext();
    };
    tester.src = archiveImageURL(item);
  } catch (e) {
    statusEl.textContent = 'tap Next again';
    next.disabled = false;
    busy = false;
  }
}

back.onclick = () => {
  if (index > 0) {
    index--;
    show(history[index]);
  }
};

next.onclick = getNext;

img.onclick = () => overlay.classList.add('open');

done.onclick = () => {
  const [a,b] = normalizedRange();
  localStorage.setItem('oldImageRange', JSON.stringify({from:a,to:b}));
  overlay.classList.remove('open');
  history = [];
  index = -1;
  getNext();
};

overlay.onclick = e => {
  if (e.target === overlay) overlay.classList.remove('open');
};

getNext();
</script>
</body>
</html>
